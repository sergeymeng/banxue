services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tutor-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  tutor-data:
