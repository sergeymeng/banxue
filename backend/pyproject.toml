[project]
name = "local-private-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "pypdf>=5,<7",
    "tiktoken>=0.9,<1",
    "websockets>=15,<17",
    "pillow>=11,<14",
]
[dependency-groups]
dev = [
    "pyinstaller>=6.22,<7",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "reportlab>=4,<5",
    "ruff>=0.11,<1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
